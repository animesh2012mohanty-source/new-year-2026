<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy New Year 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  padding: 25px;
  border-radius: 16px;
  width: 90%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.4);
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin: 15px 0;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: #00c6ff;
  color: black;
  font-size: 16px;
  cursor: pointer;
  margin: 8px;
}

button:hover {
  background: #00e5ff;
}

.share {
  background: #25D366;
  color: black;
}

hr {
  border: 0;
  height: 1px;
  background: rgba(255,255,255,0.3);
  margin: 15px 0;
}
</style>
</head>

<body>

<div class="card">
  <h2>🎆 Happy New Year 2026 🎆</h2>
  <p>Enter your name 👇</p>

  <input type="text" id="username" placeholder="Your name">

  <button onclick="showResult()">Enter ✨</button>

  <div id="result"></div>

  <button class="share" onclick="sharePage()">📲 Share with Friends</button>
</div>

<script>
/* ========= TRAIT BANK ========= */
const traits = {
  personality: [
    "creative thinker", "natural leader", "deep observer",
    "calm and composed", "emotionally intelligent",
    "curious learner", "innovative mind",
    "balanced personality", "kind-hearted soul",
    "confident yet humble", "sharp decision maker",
    "visionary mindset"
  ],

  strengths: [
    "turns ideas into reality",
    "connects easily with people",
    "handles challenges smartly",
    "learns fast and adapts",
    "inspires others naturally",
    "never stops improving",
    "balances logic and emotions",
    "brings positivity everywhere"
  ],

  techVibes: [
    "future AI thinker 🤖",
    "creative coder 💻",
    "startup founder energy 🚀",
    "logic + creativity combo ⚡",
    "next-gen innovator 🔧",
    "debugger mindset 🧠",
    "digital-age leader 🌐"
  ],

  predictions: [
    "2026 will unlock new opportunities",
    "a major personal upgrade is coming",
    "confidence will rise sharply",
    "new skills will shape your future",
    "success through consistency awaits",
    "strong friendships will form",
    "creative growth will dominate",
    "recognition is on the way"
  ]
};

const relations = [
  "Both names represent curiosity and discovery",
  "Animesh and this name together symbolize intelligence and balance",
  "A bond of creativity and logic is visible",
  "Both energies complement each other perfectly",
  "A connection built on understanding and growth",
  "Friendship powered by trust and innovation",
  "Together, the names reflect positivity and progress"
];

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ========= MAIN FUNCTION ========= */
function showResult() {
  const name = document.getElementById("username").value.trim();
  if (!name) return alert("Please enter your name!");

  document.getElementById("result").innerHTML = `
    <hr>
    <h3>✨ Hello ${name}!</h3>

    <p><b>Personality:</b> ${pick(traits.personality)}</p>
    <p><b>Strength:</b> ${pick(traits.strengths)}</p>
    <p><b>Tech Vibe:</b> ${pick(traits.techVibes)}</p>

    <hr>

    <p><b>${name} × Animesh Connection:</b><br>
    ${pick(relations)}</p>

    <hr>

    <p><b>2026 Prediction:</b><br>
    ${pick(traits.predictions)}</p>

    <p style="margin-top:15px;">
    🌟 Wishing you a powerful and joyful New Year!<br>
    — From <b>Animesh</b> 😎💙
    </p>
  `;
}

/* ========= SHARE ========= */
function sharePage() {
  const text = "🎆 Check this cool New Year website made by Animesh 😎✨";
  const url = window.location.href;

  if (navigator.share) {
    navigator.share({ text, url });
  } else {
    alert("Copy this link and share:\n" + url);
  }
}
</script>

</body>
</html>
